  # ---------------------------------------------------------------------
  # TriggerAgentFunction: thin trigger invoked by the survey-tool webhook
  # (or facilitator CLI). Fires the Orchestrator asynchronously since even
  # a 60s round is far past the API Gateway 29s integration cap.
  # ---------------------------------------------------------------------
  TriggerAgentFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: trigger-agent-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt OrchestratorFunction.Arn
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'

  TriggerAgentFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TriggerAgentFunctionRole.Arn
      Timeout: 10
      Environment:
        Variables:
          ORCHESTRATOR_FUNCTION_NAME: !Ref OrchestratorFunction
      Code:
        ZipFile: |
          import json, os, boto3

          lambda_client = boto3.client('lambda')
          ORCHESTRATOR_FUNCTION_NAME = os.environ['ORCHESTRATOR_FUNCTION_NAME']


          def handler(event, context):
              try:
                  payload = json.loads(event.get('body') or '{}')
              except json.JSONDecodeError:
                  return {'statusCode': 400, 'body': json.dumps({'error': 'invalid_json'})}

              table_id = payload.get('table_id')
              prompt = payload.get('prompt')
              if not table_id or not prompt:
                  return {'statusCode': 400, 'body': json.dumps({'error': 'table_id and prompt are required'})}

              invoke_payload = {'table_id': str(table_id), 'prompt': prompt}
              # Optional override - handler.py's own DEFAULT_ROUND_SECONDS
              # fallback (60s, the event's round length) applies when
              # this is omitted.
              round_seconds = payload.get('round_seconds')
              if round_seconds is not None:
                  invoke_payload['round_seconds'] = int(round_seconds)

              lambda_client.invoke(
                  FunctionName=ORCHESTRATOR_FUNCTION_NAME,
                  InvocationType='Event',
                  Payload=json.dumps(invoke_payload).encode('utf-8'),
              )
              return {'statusCode': 202, 'body': json.dumps({'status': 'round_started', 'table_id': table_id})}

  TriggerAgentPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TriggerAgentFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GatewayApi}/*/*/trigger-agent

  # ---------------------------------------------------------------------
  # EndRoundFunction: the deterministic end-of-round signal (see
  # scripts/end_round.sh). Invokes the Orchestrator SYNCHRONOUSLY
  # (RequestResponse, unlike TriggerAgentFunction's Event invoke above) -
  # the caller needs to know the config reset actually happened before
  # moving on to verify_config_reset, not just that the request was
  # accepted. reset_config() itself is a couple of DynamoDB calls, so
  # this comfortably fits well inside API Gateway's 29s integration cap.
  # ---------------------------------------------------------------------
  EndRoundFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: end-round-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt OrchestratorFunction.Arn
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'

  EndRoundFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt EndRoundFunctionRole.Arn
      Timeout: 15
      Environment:
        Variables:
          ORCHESTRATOR_FUNCTION_NAME: !Ref OrchestratorFunction
      Code:
        ZipFile: |
          import json, os, boto3

          lambda_client = boto3.client('lambda')
          ORCHESTRATOR_FUNCTION_NAME = os.environ['ORCHESTRATOR_FUNCTION_NAME']


          def handler(event, context):
              try:
                  payload = json.loads(event.get('body') or '{}')
              except json.JSONDecodeError:
                  return {'statusCode': 400, 'body': json.dumps({'error': 'invalid_json'})}

              table_id = payload.get('table_id')
              if not table_id:
                  return {'statusCode': 400, 'body': json.dumps({'error': 'table_id is required'})}

              resp = lambda_client.invoke(
                  FunctionName=ORCHESTRATOR_FUNCTION_NAME,
                  InvocationType='RequestResponse',
                  Payload=json.dumps({'action': 'end_round', 'table_id': str(table_id)}).encode('utf-8'),
              )
              result_payload = json.loads(resp['Payload'].read())
              if resp.get('FunctionError'):
                  return {'statusCode': 502, 'body': json.dumps({'error': 'orchestrator_error', 'detail': result_payload})}
              return {'statusCode': 200, 'body': json.dumps({'status': 'round_ended', 'table_id': table_id, 'reset_result': result_payload})}

  EndRoundPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EndRoundFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GatewayApi}/*/*/end-round

  # ---------------------------------------------------------------------
  # OrchestratorFunction: the "blue agent". Packaged separately (it needs
  # the anthropic SDK) - see scripts/build_lambdas.sh + scripts/deploy.sh,
  # which run `aws cloudformation package` to upload build/orchestrator.zip.
  # ---------------------------------------------------------------------
  OrchestratorFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: orchestrator-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !GetAtt StateTable.Arn
              - Effect: Allow
                Action: cognito-idp:UpdateUserPoolClient
                Resource: !GetAtt UserPool.Arn
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'
              # Bedrock invoke, in place of a direct Anthropic API key - covers
              # both a plain foundation-model ARN and a cross-region inference
              # profile ARN, since ModelId may be either depending on region.
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - arn:aws:bedrock:*::foundation-model/anthropic.*
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*

  OrchestratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt OrchestratorFunctionRole.Arn
      Timeout: 300
      MemorySize: 512
      Code: build/orchestrator.zip
      Environment:
        Variables:
          STATE_TABLE_NAME: !Ref StateTable
          MODEL_ID: !Ref ModelId
          USER_POOL_ID: !Ref UserPool
          GOOD_CLIENT_ID: !Ref GoodClient
          ADVERSARIAL_CLIENT_ID: !Ref AdversarialClient
          ROUND_SECONDS: '60'

  # ---------------------------------------------------------------------
  # Explicit log groups for every Lambda, instead of relying on the ones
  # Lambda auto-creates on first invocation. Two reasons: (1) an
  # auto-created log group is NOT a stack resource, so it does not
  # inherit the stack-level Tags below - it would be invisible to a
  # "Project"/"Project_Run" cost-allocation-tag filter even though it's
  # part of this project's spend; (2) auto-created log groups default to
  # "Never expire" retention, a silent, unbounded cost creep.
  #
  # This list previously missed JwtAuthorizerFunction (6 Lambdas in this
  # stack, only 5 explicit groups) - confirmed live: 5 untagged, never-
  # expiring orphaned log groups had accumulated across past deploy/
  # teardown cycles, invisible to check_tags.sh (its tag-based Pass 1
  # can't see untagged resources, and Pass 2's name-based sweep never
  # scanned CloudWatch Logs at all - both gaps, now fixed).
  #
  # Then missed EndRoundFunction the same way (7 Lambdas, still only 6
  # explicit groups until this comment) - the exact same bug recurring on
  # a later-added Lambda. RetentionInDays: 1 (not 14) on every group
  # here, consistently - the shortest native CloudWatch Logs supports;
  # there is no sub-day retention setting in the API at all, so this is
  # the real floor, not an arbitrary choice.
  # ---------------------------------------------------------------------
  JwtAuthorizerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${JwtAuthorizerFunction}
      RetentionInDays: 1
  Service1LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Service1Function}
      RetentionInDays: 1
  Service2LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Service2Function}
      RetentionInDays: 1
  Service3LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Service3Function}
      RetentionInDays: 1
  TriggerAgentFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TriggerAgentFunction}
      RetentionInDays: 1
  EndRoundFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${EndRoundFunction}
      RetentionInDays: 1
  OrchestratorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${OrchestratorFunction}
      RetentionInDays: 1
  # API Gateway's own execution logs (authorizer invocation/response,
  # integration latency, method completion) - a DIFFERENT log group than
  # any single Lambda's, auto-named by AWS in this exact format. Declared
  # explicitly for the same two reasons as the Lambda groups above (cost-
  # allocation tagging, bounded retention) plus a third: this is what we
  # actually need to see WHERE a request got rejected when it never
  # reaches any Lambda at all - confirmed live, a real round had 3
  # adversarial requests 403 with API Gateway's own SigV4-parsing error
  # text, indistinguishable from our own Lambdas' behavior until this
  # exists. LoggingLevel INFO (not the full DataTraceEnabled request/
  # response dump) - enough to see authorizer-flow decisions without
  # writing real bearer tokens into CloudWatch Logs.
  ApiGatewayExecutionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "API-Gateway-Execution-Logs_${GatewayApi}/prod"
      RetentionInDays: 1

  # ---------------------------------------------------------------------
  # Dashboard: score = RUNNING_SUM(adversarial_denied) -
  # RUNNING_SUM(good_denied), per table - a cumulative running total:
  # +1 for every adversarial request blocked, -1 for every good request
  # blocked, nothing else. No baseline/target-rate term: docs/proposal.md's
  # original formula (N_x_baseline - N_x_attempt, i.e. N_x_denied) was
  # already exactly this once reduced algebraically - a per-minute,
  # rate-vs-baseline version of this widget shipped first and was wrong
  # (dimensionally incoherent: comparing a whole-round constant against
  # one minute's count), confirmed by testing against a real deployed
  # table and seeing every minute render an identical, clearly-impossible
  # score. Fixed to this simpler, more accurate, and self-evidently
  # correct form: a no-op defense that blocks nothing scores exactly 0;
  # a defense that blocks everything scores deeply negative - see
  # scripts/lib/scoring.py's docstring for the full reasoning, and
  # DEPLOYMENT.md's "Scoring" section for the facilitator-facing summary.
  #
  # Every widget below enumerates TableId "1".."12" explicitly with the
  # classic exact-dimension metric syntax (Namespace, MetricName, and all
  # three published dimensions), rather than a CloudWatch SEARCH()
  # expression. With a small, fixed, known set of tables this is more
  # verbose but removes any doubt about how CloudWatch aligns two
  # independently-faceted SEARCH results when computing the score's
  # arithmetic - correctness over cleverness for what's the primary

  # One Permission per service covers the {proxy+} method (SourceArn
  # ending in "/service<N>/*" - requires that literal trailing slash);
  # a SEPARATE Permission is needed for the new bare-resource
  # Service<N>RootMethod above, whose method ARN is exactly
  # ".../service<N>" with no trailing slash at all - "/service<N>/*"
  # does NOT match that (IAM ARN wildcard matching needs the literal
  # "/" to be present in the invoked ARN, not just implied by the
  # glob), so without this, the bare-resource method would route
  # correctly but get an AccessDenied invoking the Lambda - confirmed
  # by checking IAM's actual glob semantics, not assumed.
  Service1Permission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Service1Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GatewayApi}/*/*/service1/*
  Service1RootPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Service1Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GatewayApi}/*/*/service1
  Service2Permission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
